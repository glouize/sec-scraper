[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-scraper"
version = "0.1.0"
description = "Pull quarterly revenue from SEC EDGAR filings and generate financial charts by code"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0"
]

[project.scripts]
sec-scraper = "sec_revenue_scraper:main"

[tool.setuptools]
py-modules = ["sec_revenue_scraper"]
